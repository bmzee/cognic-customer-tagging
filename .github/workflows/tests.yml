name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only: nothing to install. The draft safety-file schema
      # is private and never reaches this public repository or its CI, so the
      # schema test is skipped here (see docs/OPEN-QUESTIONS.md, Q1).
      - name: Run the tests
        run: python -m unittest discover -s tests -t .
